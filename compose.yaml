name: crafthost

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: crafthost
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  control:
    image: crafthost-control
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DAEMON_SECRET: ${DAEMON_SECRET:?Set DAEMON_SECRET in .env}
      HOSTNAME_INDIA: ${HOSTNAME_INDIA:-}
      HOSTNAME_KOREA: ${HOSTNAME_KOREA:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_KEY_PAIR_NAME: ${AWS_KEY_PAIR_NAME:-}
      AWS_INSTANCE_PROFILE_ENABLED: ${AWS_INSTANCE_PROFILE_ENABLED:-false}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CONTROL_PORT:-3000}:3000"

  scheduler:
    image: crafthost-control
    command: ["node", "backend/scheduler.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      DAEMON_SECRET: ${DAEMON_SECRET:?Set DAEMON_SECRET in .env}
      AUTO_STOP_IDLE_SERVERS: ${AUTO_STOP_IDLE_SERVERS:-true}
      AUTO_STOP_IDLE_EC2: ${AUTO_STOP_IDLE_EC2:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_KEY_PAIR_NAME: ${AWS_KEY_PAIR_NAME:-}
      AWS_INSTANCE_PROFILE_ENABLED: ${AWS_INSTANCE_PROFILE_ENABLED:-false}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongo-data:
  redis-data:
