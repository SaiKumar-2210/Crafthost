name: CraftHost CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
          
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install Backend Dependencies
      working-directory: ./backend
      run: npm ci || npm install

    - name: Run Backend Tests
      working-directory: ./backend
      run: npm test
      env:
        # These are used for the integration tests. 
        # For actual production, set these in GitHub Repository Secrets!
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
        JWT_SECRET: ${{ secrets.JWT_SECRET  }}
        DAEMON_SECRET: ${{ secrets.DAEMON_SECRET }}
        NODE_ENV: test

  frontend-build:
    name: Frontend Build Verification
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Frontend Dependencies
      run: npm ci || npm install

    - name: Verify React Build
      run: npm run build
      env:
        VITE_API_BASE: /api

  deploy:
    name: Deploy to AWS VM
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    # Enable after configuring a reachable Docker control-plane VM and its deployment secrets.
    if: github.ref == 'refs/heads/main' && vars.ENABLE_SSH_DEPLOY == 'true'
    
    steps:
    - name: Execute deployment commands via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.AWS_VM_IP }}
        username: ${{ secrets.AWS_VM_USERNAME }}
        key: ${{ secrets.AWS_VM_SSH_KEY }}
        command_timeout: 10m
        script: |
          # appleboy executes remote scripts through the login shell; keep this POSIX-compatible.
          set -e
          echo "=== Docker deployment starting ==="
          if [ ! -d "/opt/crafthost-control" ]; then
            sudo git clone https://github.com/${{ github.repository }}.git /opt/crafthost-control
          else
            cd /opt/crafthost-control
            sudo git fetch origin main
            sudo git reset --hard origin/main
          fi

          echo "=== Fix ownership ==="
          sudo chown -R $(whoami):$(whoami) /opt/crafthost-control
          cd /opt/crafthost-control
          docker compose -f compose.yaml up -d --build control scheduler
          docker compose -f compose.yaml ps
          echo "=== Docker deployment complete ==="
